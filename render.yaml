services:
  - type: web
    name: simtele-risk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/salud
    envVars:
      - key: SIMTELE_AUTOCREAR
        value: "0"
      - key: SIMTELE_DB
        value: /tmp/simtele.db
